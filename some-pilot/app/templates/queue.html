{% extends "base.html" %}{% block content %}<h1>Produktionskø</h1><table><tr><th>ID</th><th>Version</th><th>Status</th><th>Format</th><th>Type</th><th></th></tr>{% for video in videos %}<tr><td>{{ video.id }}</td><td>{{ video.version }}</td><td><span class="status">{{ video.status }}</span></td><td>{{ video.format }}</td><td>{{ 'DEMO' if video.features_json.get('is_demo') else 'PRODUKTION' }}</td><td><a href="/review/{{ video.id }}">Åbn</a></td></tr>{% endfor %}</table>{% endblock %}
