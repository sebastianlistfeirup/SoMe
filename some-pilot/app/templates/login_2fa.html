<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bekræft login — {{ app_name }}</title><link rel="stylesheet" href="/static/style.css"></head><body class="login"><main><h1>{{ app_name }}</h1><p>Skriv den 6-cifrede kode fra din authenticator-app, eller en gendannelseskode.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" action="/login/2fa"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next }}"><label>Kode<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="20" required autofocus></label><button>Bekræft</button></form></main></body></html>
